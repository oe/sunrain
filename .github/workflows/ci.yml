name: Validate Sunrain

on:
  # PRs validate their merge result. main is validated by the deployment caller.
  pull_request:
  workflow_dispatch:
    inputs:
      browser-suite:
        description: Chromium regression or optional cross-engine smoke checks
        type: choice
        options: [chromium, compatibility]
        default: chromium
  workflow_call:
    outputs:
      pages-artifact-name:
        description: The verified Pages artifact produced by this workflow
        value: ${{ jobs.validate.outputs.pages-artifact-name }}
    inputs:
      upload-pages-artifact:
        description: Upload the exact tested build for the deployment job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep this distinct from the caller's Pages deployment lock.
  group: sunrain-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_SUITE: ${{ inputs.browser-suite || 'chromium' }}
    outputs:
      pages-artifact-name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --prod --audit-level=high

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck and build
        run: pnpm build

      - name: Verify source contracts and build identity
        run: |
          pnpm verify:sunrain
          node scripts/verify-build-identity.mjs

      - name: Install test browser
        run: |
          if [ "$BROWSER_SUITE" = compatibility ]; then
            pnpm exec playwright install --with-deps firefox webkit
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Browser regressions against the production build
        run: |
          if [ "$BROWSER_SUITE" = compatibility ]; then
            pnpm test:compat
          else
            pnpm test:e2e
          fi

      - name: Verify build identity after tests
        run: node scripts/verify-build-identity.mjs

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence-${{ env.BROWSER_SUITE }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            dist/build-metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validated Pages artifact
        if: ${{ success() && inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist
